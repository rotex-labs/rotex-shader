[package]
name = "rotex-shader-graph"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed host shader graph that emits Slang source"
documentation = "https://docs.rs/rotex-shader-graph"
repository = "https://github.com/rotex-labs/rotex-shader"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
cook = ["dep:rotex-shader-cooker"]

[dependencies]
rotex-shader-core = { path = "../rotex-shader-core", version = "0.3.0" }
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "588c843b8b2e2f45895882c90f762b669c925c09" }
rotex-shader-cooker = { path = "../rotex-shader-cooker", version = "0.3.0", optional = true }
