[package]
name = "rotex-shader-core"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared shader compilation vocabulary for Rotex"
documentation = "https://docs.rs/rotex-shader-core"
repository = "https://github.com/rotex-labs/rotex-shader"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
blake3 = "1"
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "588c843b8b2e2f45895882c90f762b669c925c09" }
thiserror = "2.0.18"
